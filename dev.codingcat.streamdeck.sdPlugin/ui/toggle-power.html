<!DOCTYPE html>
<html>

<head lang="en">
    <title>LIFX Toggle Power Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="API Token">
        <sdpi-password setting="apiToken" global placeholder="LIFX Token (cloud.lifx.com/access_tokens)"></sdpi-password>
    </sdpi-item>

    <sdpi-item label="Target">
        <sdpi-select setting="selector" datasource="getSelectors" loading="Loading LIFX lights..." show-refresh hot-reload default="all"></sdpi-select>
    </sdpi-item>

    <sdpi-item label="Power Action">
        <sdpi-select setting="powerMode" default="toggle">
            <option value="toggle">Toggle Power</option>
            <option value="on">Turn On</option>
            <option value="off">Turn Off</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Duration (s)">
        <sdpi-range setting="duration" min="0" max="10" step="0.5" default="1" showlabels></sdpi-range>
    </sdpi-item>
</body>

</html>
