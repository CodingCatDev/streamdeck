<!DOCTYPE html>
<html>

<head lang="en">
    <title>LIFX Activate Scene Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="API Token">
        <sdpi-password setting="apiToken" global placeholder="LIFX Token (cloud.lifx.com/access_tokens)"></sdpi-password>
    </sdpi-item>

    <sdpi-item label="Mode">
        <sdpi-select setting="sceneMode" default="toggle">
            <option value="toggle">Toggle Scene(s) On / Off</option>
            <option value="activate">Activate Scene(s) (Always On)</option>
            <option value="off">Turn Off Lights in Scene(s)</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Scenes">
        <sdpi-checkbox-list setting="sceneUuids" datasource="getScenes" loading="Loading LIFX scenes..." show-refresh hot-reload></sdpi-checkbox-list>
    </sdpi-item>

    <sdpi-item label="Duration (s)">
        <sdpi-range setting="duration" min="0" max="15" step="0.5" default="1" showlabels></sdpi-range>
    </sdpi-item>

    <sdpi-item label="Ignore">
        <sdpi-checkbox setting="ignorePower" label="Keep current Power state"></sdpi-checkbox>
        <sdpi-checkbox setting="ignoreBrightness" label="Keep current Brightness"></sdpi-checkbox>
        <sdpi-checkbox setting="ignoreColor" label="Keep current Color"></sdpi-checkbox>
    </sdpi-item>

    <sdpi-item label="Fast Mode">
        <sdpi-checkbox setting="fast" label="Skip state verification"></sdpi-checkbox>
    </sdpi-item>
</body>

</html>
