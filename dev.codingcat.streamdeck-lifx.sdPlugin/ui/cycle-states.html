<!DOCTYPE html>
<html>

<head lang="en">
    <title>LIFX Cycle States Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="API Token">
        <sdpi-password setting="apiToken" global placeholder="LIFX Token (cloud.lifx.com/access_tokens)"></sdpi-password>
    </sdpi-item>

    <sdpi-item label="Target">
        <sdpi-select setting="selector" datasource="getSelectors" loading="Loading LIFX lights..." show-refresh hot-reload default="all"></sdpi-select>
    </sdpi-item>

    <sdpi-item label="States to Cycle">
        <sdpi-textarea setting="statesList" rows="4" placeholder="red, green, blue, kelvin:2700, kelvin:6500 (or JSON array of state objects)"></sdpi-textarea>
    </sdpi-item>

    <sdpi-item label="Direction">
        <sdpi-select setting="direction" default="forward">
            <option value="forward">Forward</option>
            <option value="backward">Backward</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Duration (s)">
        <sdpi-range setting="duration" min="0" max="5" step="0.5" default="0.5" showlabels></sdpi-range>
    </sdpi-item>
</body>

</html>
